{% load static %}

<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solicitar Correção - SiEv</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <style>

        <style>

    /* ==================================================
       PÁGINA DE CORREÇÃO - SIEV
       ================================================== */

    body {

        margin: 0;

        background: #f4f1ed;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        color: #333;

    }


    /* ==================================================
       TOPO
       ================================================== */

    .topo {

        background: #806f59;

        color: white;

        padding: 18px 30px;

        font-size: 21px;

        font-weight: 600;

        box-shadow:
            0 3px 10px
            rgba(0, 0, 0, .12);

    }


    /* ==================================================
       CARD PRINCIPAL
       ================================================== */

    .container-correcao {

        max-width: 900px;

        margin: 45px auto;

        background: white;

        padding: 35px 40px;

        border-radius: 18px;

        box-shadow:
            0 8px 25px
            rgba(0, 0, 0, .10);

        border: 1px solid #e6e0da;

    }


    /* ==================================================
       TÍTULO
       ================================================== */

    .titulo {

        display: flex;

        align-items: center;

        gap: 10px;

        color: #806f59;

        font-size: 28px;

        font-weight: 700;

        margin-bottom: 8px;

    }


    .titulo i {

        font-size: 27px;

    }


    /* ==================================================
       TEXTO DE APOIO
       ================================================== */

    .subtitulo {

        color: #777;

        margin-bottom: 25px;

        font-size: 15px;

    }


    /* ==================================================
       IDENTIFICAÇÃO DA SOLICITAÇÃO
       ================================================== */

    .protocolo {

        background: #f7f5f2;

        border-left: 5px solid #806f59;

        padding: 18px 20px;

        border-radius: 10px;

        margin-bottom: 28px;

        line-height: 1.8;

        color: #444;

    }


    .protocolo strong {

        color: #806f59;

    }


    /* ==================================================
       LABEL
       ================================================== */

    .form-label {

        color: #4d463f;

        font-weight: 600;

        margin-bottom: 8px;

    }


    /* ==================================================
       TEXTAREA
       ================================================== */

    textarea {

        width: 100%;

        min-height: 190px;

        resize: vertical;

        border: 1px solid #d5cec6;

        border-radius: 10px;

        padding: 14px 16px;

        font-size: 15px;

        color: #333;

        background: #fff;

        box-sizing: border-box;

        transition:
            border-color .2s,
            box-shadow .2s;

    }


    textarea:focus {

        outline: none;

        border-color: #806f59;

        box-shadow:
            0 0 0 3px
            rgba(128, 111, 89, .15);

    }


    textarea::placeholder {

        color: #999;

    }


    /* ==================================================
       ÁREA DOS BOTÕES
       ================================================== */

    .acoes {

        display: flex;

        justify-content: flex-end;

        align-items: center;

        gap: 12px;

        margin-top: 25px;

        padding-top: 22px;

        border-top: 1px solid #eee;

    }


    /* ==================================================
       BOTÃO ENVIAR
       ================================================== */

    .btn-enviar {

        background: #806f59;

        color: white;

        border: none;

        padding: 12px 22px;

        border-radius: 9px;

        font-weight: 600;

        font-size: 15px;

        cursor: pointer;

        text-decoration: none;

        transition:
            background .2s,
            transform .2s,
            box-shadow .2s;

    }


    .btn-enviar:hover {

        background: #6d5d4b;

        color: white;

        transform: translateY(-1px);

        box-shadow:
            0 4px 10px
            rgba(0, 0, 0, .12);

    }


    /* ==================================================
       BOTÃO VOLTAR
       ================================================== */

    .btn-voltar {

        background: #e9e5e0;

        color: #5d554d;

        padding: 12px 22px;

        border-radius: 9px;

        text-decoration: none;

        font-weight: 600;

        font-size: 15px;

        transition:
            background .2s,
            color .2s,
            transform .2s;

    }


    .btn-voltar:hover {

        background: #dcd5cd;

        color: #403a34;

        transform: translateY(-1px);

    }
    .topo {

        display: flex;

        align-items: center;

        gap: 18px;

    }

    .topo div {

        font-size: 22px;

        font-weight: 700;

    }

    .topo span {

        font-size: 14px;

        font-weight: 400;

        opacity: .9;

    }

    /* ==================================================
       RESPONSIVIDADE
       ================================================== */

    @media (max-width: 700px) {

        .topo {

            padding: 16px 20px;

            font-size: 18px;

        }


        .container-correcao {

            margin: 25px 15px;

            padding: 25px 20px;

        }


        .titulo {

            font-size: 24px;

        }


        .acoes {

            flex-direction: column;

            align-items: stretch;

        }


        .btn-enviar,
        .btn-voltar {

            width: 100%;

            text-align: center;

            box-sizing: border-box;

        }

    }

</style>

    </style>

</head>

<body>

<div class="topo">

    <div>
        <i class="bi bi-shield-check"></i>
        SiEv
    </div>

    <span>
        Sistema Inteligente de Eventos
    </span>

</div>

<div class="container-correcao">

    <div class="titulo">

        <i class="bi bi-pencil-square"></i>

        Solicitar Correção

    </div>

    <div class="protocolo">

        <strong>Protocolo:</strong>

        {{ solicitacao.protocolo }}

        <br>

        <strong>Evento:</strong>

        {{ solicitacao.nome_evento }}

        <br>

        <strong>Município:</strong>

        {{ solicitacao.municipio }}

    </div>

    <form method="POST">

        {% csrf_token %}

        <label class="form-label">

            <strong>
                Motivo da correção
            </strong>

        </label>

        <textarea
            name="motivo"
            placeholder="Informe claramente o que precisa ser corrigido..."
            required
        ></textarea>

        <div class="acoes">

            <button
                type="submit"
                class="btn-enviar"
            >

                <i class="bi bi-send"></i>

                Enviar para Correção

            </button>

            <a
                href="{% url 'aprovacoes' %}"
                class="btn-voltar"
            >

                Voltar

            </a>

        </div>

    </form>

</div>

</body>

</html>
