{% extends 'base.html' %}
{% block title %}{% if novo %}Novo usuário{% else %}Editar usuário{% endif %}{% endblock %}
{% block content %}
<div style="max-width:700px;margin:35px auto;padding:0 15px"><div style="background:#fff;border-radius:18px;padding:30px;box-shadow:0 8px 24px rgba(0,0,0,.08)"><h1 style="color:#907C64">👤 {% if novo %}Novo usuário{% else %}Editar usuário{% endif %}</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}{% if novo %}<p><label>Senha</label><input type="password" name="senha" minlength="8" required style="width:100%;padding:11px"><label>Confirmar senha</label><input type="password" name="confirmar" minlength="8" required style="width:100%;padding:11px"></p>{% endif %}<button type="submit" style="background:#907C64;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-weight:bold">Salvar</button> <a href="{% url 'administracao_sistema' %}">Cancelar</a></form></div></div>
{% endblock %}
