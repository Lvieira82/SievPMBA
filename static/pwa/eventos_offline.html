<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#907c64"><title>Eventos do Dia — Offline</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:0 auto;padding:18px}.top{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px}.top h1{margin:0 0 8px;font-size:26px}.badge{display:inline-block;padding:6px 10px;border-radius:8px;font-weight:700;background:#fef3c7;color:#92400e}.status{margin-top:10px;font-size:14px}.card{background:#fff;border:1px solid #d1d5db;border-left:5px solid #907c64;border-radius:14px;padding:18px;margin-bottom:14px}.card h2{margin:0 0 12px;color:#907c64;font-size:21px}.card p{margin:7px 0;color:#374151}.btn{width:100%;border:0;border-radius:9px;padding:12px;background:#166534;color:#fff;font-weight:700;font-size:16px;margin-top:14px}.btn-registrado{width:100%;border:0;border-radius:9px;padding:12px;background:#e5e7eb;color:#4b5563;font-weight:700;font-size:16px;margin-top:14px;text-align:center}.btn-pendente{width:100%;border:0;border-radius:9px;padding:12px;background:#fef3c7;color:#92400e;font-weight:700;font-size:15px;margin-top:14px;text-align:center}.empty{background:#fff;padding:20px;border-radius:12px;font-weight:600}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.sheet{width:100%;max-width:700px;background:#fff;border-radius:20px 20px 0 0;padding:22px;max-height:92vh;overflow:auto}.sheet h2{margin-top:0}.sheet label{display:block;font-weight:700;margin:14px 0 7px}.sheet input,.sheet textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px}.sheet input[type=radio],.sheet input[type=checkbox]{width:19px;height:19px;margin-right:8px}.resposta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.resposta-opcao{display:flex!important;align-items:center;background:#f8f9fa;border:1px solid #d1d5db;border-radius:9px;padding:13px}.motivos{display:grid;gap:8px}.motivo{display:flex!important;align-items:center;background:#f8f9fa;border:1px solid #e5e7eb;border-radius:8px;padding:10px}.sheet textarea{min-height:90px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}.secondary{background:#fff!important;color:#374151!important;border:1px solid #bbb!important}.gps{font-size:14px;font-weight:700;margin-top:8px}.ok{color:#15803d}.err{color:#b91c1c}.foto-preview{max-width:100%;border-radius:10px;margin-top:10px;display:none}.pend{margin-top:12px;padding:10px;border-radius:8px;background:#fff7ed;color:#9a3412;font-weight:700}.online{background:#dcfce7;color:#166534}.sync{margin-top:10px}.camera-label{display:block!important;text-align:center;background:#166534;color:#fff;border-radius:9px;padding:12px;font-weight:700;cursor:pointer;margin-top:10px}.camera-input{position:absolute;width:1px!important;height:1px!important;opacity:0;pointer-events:none}@media(max-width:600px){.resposta{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><h1>📅 Eventos do Dia</h1><span class="badge">🔴 MODO OFFLINE</span><div id="info" class="status">Carregando os eventos armazenados neste dispositivo...</div><div id="sync" class="sync"></div></div><div id="lista"></div></div>
<div id="modal" class="modal"><div class="sheet"><h2 id="modal-titulo">Registrar atendimento</h2><div id="modal-info"></div><label>Resposta da OPO</label><div class="resposta"><label class="resposta-opcao"><input type="radio" name="resposta_opo" value="SIM"> SIM — Cumprida</label><label class="resposta-opcao"><input type="radio" name="resposta_opo" value="NAO"> NÃO — Não cumprida</label></div><div id="campo-foto" style="display:none"><label for="foto" class="camera-label">📷 Tirar foto</label><input id="foto" class="camera-input" type="file" accept="image/*" capture="environment"><img id="preview" class="foto-preview" alt="Prévia da foto"><div id="gps" class="gps">A localização GPS será solicitada após selecionar SIM.</div></div><div id="campo-just" style="display:none"><label>Principais motivos do não cumprimento <span style="font-weight:400;color:#6b7280;font-size:13px">(selecione um ou mais)</span></label><div class="motivos"><label class="motivo"><input type="checkbox" name="motivos_nao" value="VIATURA_PROBLEMA"> Viatura apresentou problema</label><label class="motivo"><input type="checkbox" name="motivos_nao" value="DELEGACIA"> Apresentação na delegacia</label><label class="motivo"><input type="checkbox" name="motivos_nao" value="OCORRENCIA"> Guarnição em Ocorrência</label><label class="motivo"><input type="checkbox" name="motivos_nao" value="ENDERECO"> Endereço não encontrado</label><label class="motivo"><input type="checkbox" name="motivos_nao" value="CANCELADO"> Evento Cancelado</label><label class="motivo"><input type="checkbox" name="motivos_nao" value="HORARIO"> Horário alterado</label></div><label for="just">Observações / justificativa</label><textarea id="just" maxlength="150" placeholder="Acrescente outras informações, se necessário."></textarea><div style="text-align:right;color:#6b7280;font-size:13px;margin-top:4px"><span id="contador">0</span>/150</div></div><div class="actions"><button id="salvar" class="btn" disabled>Salvar atendimento</button><button id="fechar" class="btn secondary">Cancelar</button></div></div></div>
<script src="/static/pwa/eventos_offline.js?v=4"></script>
</body>
</html>
