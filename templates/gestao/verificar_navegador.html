{% block content %}
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar acesso - SiEv</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f3f6;font-family:Arial}.card{width:min(430px,90%);background:#fff;border-radius:20px;padding:38px;box-shadow:0 12px 35px #0002;text-align:center}h1{color:#907C64}p{color:#475569;line-height:1.5}input{width:100%;box-sizing:border-box;padding:16px;border:1px solid #cbd5e1;border-radius:10px;text-align:center;font-size:28px;letter-spacing:8px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#907C64;color:#fff;font-weight:bold;font-size:16px}.aviso{margin-top:18px;font-size:13px}</style></head><body><div class="card"><h1>Confirmar novo navegador</h1><p>Enviamos um código de <strong>4 números</strong> para o e-mail cadastrado. Informe o código para autorizar este navegador.</p><form method="post">{% csrf_token %}<input name="codigo" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" required autofocus><button type="submit">Confirmar acesso</button></form><p class="aviso">O código é válido por poucos minutos e pode ser usado uma única vez.</p></div></body></html>
{% endblock %}
