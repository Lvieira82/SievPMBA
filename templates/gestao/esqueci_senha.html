{% block content %}
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esqueci minha senha - SiEv</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f3f6;font-family:Arial}.card{width:min(430px,90%);background:#fff;border-radius:20px;padding:38px;box-shadow:0 12px 35px #0002}h1{color:#907C64}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cbd5e1;border-radius:9px}button{margin-top:18px;padding:13px 20px;border:0;border-radius:9px;background:#907C64;color:#fff;font-weight:bold}</style></head><body><div class="card"><h1>Esqueci minha senha</h1><p>Informe sua matrícula ou o e-mail cadastrado. Se houver um cadastro válido, enviaremos o link de redefinição.</p><form method="post">{% csrf_token %}<input name="identificador" placeholder="Matrícula ou e-mail" required autofocus><button type="submit">Enviar link</button></form></div></body></html>
{% endblock %}
