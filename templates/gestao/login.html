{% block content %}
<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login da Gestão - SiEv</title><style>*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#907C64,#5b5146);padding:20px}.login-container{width:100%;max-width:430px;background:#fff;padding:40px;border-radius:20px;box-shadow:0 15px 40px #0004;text-align:center}.logo{font-size:60px;font-weight:bold;color:#111827;margin-bottom:10px}.subtitulo{color:#64748b;margin-bottom:30px}h2{color:#907C64;margin-bottom:25px}input{width:100%;padding:15px;margin-bottom:15px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#907C64;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:hover{background:#111827}.links{margin-top:18px;display:flex;justify-content:space-between;gap:10px}.links a{color:#6b5a45;text-decoration:none;font-size:14px}.erro{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:8px;margin-bottom:15px}.rodape{margin-top:25px;color:#94a3b8;font-size:12px}</style></head><body><div class="login-container"><div class="logo">SiEv</div><div class="subtitulo">Sistema Integrado de Eventos</div><h2>Área Restrita da Gestão</h2>{% if messages %}{% for message in messages %}<div class="erro">{{ message }}</div>{% endfor %}{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><input type="text" name="username" placeholder="Matrícula" autocomplete="username" required><input type="password" name="password" placeholder="Senha" autocomplete="current-password" required><button type="submit">Entrar</button></form><div class="links"><a href="{% url 'esqueci_senha' %}">Esqueci minha senha</a><a href="{% url 'portal' %}">← Voltar</a></div><div class="rodape">© SiEv • Área Institucional</div></div></body></html>
{% endblock %}
