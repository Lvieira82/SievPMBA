{% block content %}
<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login da Gestão - SiEv</title><style>*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f3f6;padding:20px}.card{width:min(420px,100%);background:#fff;padding:40px;border-radius:20px;box-shadow:0 15px 40px #0003;text-align:center}h1{color:#907C64;margin-bottom:8px}.sub{color:#64748b;margin-bottom:30px}input{width:100%;padding:14px;margin:7px 0;border:1px solid #cbd5e1;border-radius:10px}button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;background:#907C64;color:#fff;font-weight:bold;font-size:16px}.msg{color:#b91c1c;background:#fff1f2;padding:10px;border-radius:8px;margin-bottom:12px}.links{margin-top:18px}.links a{color:#907C64}</style></head><body><div class="card"><h1>SiEv</h1><div class="sub">Área Restrita da Gestão</div>{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><input type="text" name="username" placeholder="Matrícula" autocomplete="username" required><input type="password" name="password" placeholder="Senha" autocomplete="current-password" required><button type="submit">Entrar</button></form><div class="links"><a href="{% url 'esqueci_senha' %}">Esqueci minha senha</a><br><br><a href="{% url 'portal' %}">← Voltar</a></div></div></body></html>
{% endblock %}
